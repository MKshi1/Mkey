[package]
name = "mkey"
version = "1.0.0"
description = "A local-first encrypted bookmark and credential vault."
authors = ["MKshi1"]
license = "MIT"
edition = "2021"

[lib]
name = "mkey_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
base64 = "0.22"
sha2 = "0.10"
url = "2.5"
rand = "0.8"
aes-gcm = "0.10"
pbkdf2 = "0.12"
html-escape = "0.2"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
